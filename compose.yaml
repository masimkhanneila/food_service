
services:
  foodie:
    build: .
    container_name: foodie-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/food_service.db
    volumes:
      - foodie_data:/data
    command: >
      sh -c '
        if [ ! -f /data/food_service.db ]; then
          cp /app/food_service.db /data/food_service.db;
        fi;
        exec uvicorn main:app --host 0.0.0.0 --port 8000
      '
    restart: unless-stopped

volumes:
  foodie_data:
